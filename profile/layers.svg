<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="Ironflowx layers: your agents and workflows sit on the ironflow engine (unreleased), which sits on the foundation crates (unreleased) and segment-log (0.1.0, released), which writes sealed history to disk."><title>Ironflowx layers: your agents and workflows sit on the ironflow engine (unreleased), which sits on the foundation crates (unreleased) and segment-log (0.1.0, released), which writes sealed history to disk.</title><style> text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#1f2328} .h{font-weight:600} .m{fill:#59636e;font-size:13px} .lb{fill:#59636e;font-size:12px;font-weight:600;letter-spacing:.04em} .b{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.2} .o{fill:none;stroke:#d1d9e0;stroke-width:1.2} .hl{fill:#ddf4ff;stroke:#0969da;stroke-width:1.6} .d{stroke-dasharray:6 4} .br{fill:none;stroke:#59636e;stroke-width:1.4} .ok{fill:#dafbe1} .okt{fill:#1a7f37;font-size:12px;font-weight:600} .no{fill:#eff2f5} .not{fill:#59636e;font-size:12px;font-weight:600}@media (prefers-color-scheme:dark){ text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#e6edf3} .h{font-weight:600} .m{fill:#9198a1;font-size:13px} .lb{fill:#9198a1;font-size:12px;font-weight:600;letter-spacing:.04em} .b{fill:#151b23;stroke:#3d444d;stroke-width:1.2} .o{fill:none;stroke:#3d444d;stroke-width:1.2} .hl{fill:#0c2d6b;stroke:#4493f8;stroke-width:1.6} .d{stroke-dasharray:6 4} .br{fill:none;stroke:#9198a1;stroke-width:1.4} .ok{fill:#12261e} .okt{fill:#3fb950;font-size:12px;font-weight:600} .no{fill:#212830} .not{fill:#9198a1;font-size:12px;font-weight:600}}</style><rect x="60" y="10" width="680" height="48" rx="8" class="o"/><text x="80" y="40"><tspan class="h">Your agents and workflows</tspan><tspan class="m" dx="12">the work that needs a history</tspan></text><rect x="60" y="76" width="680" height="48" rx="8" class="b d"/><text x="80" y="106"><tspan class="h">ironflow</tspan><tspan class="m" dx="12">the engine, rebuilt</tspan></text><rect x="630" y="89" width="94" height="22" rx="11" class="no"/><text x="677" y="104" text-anchor="middle" class="not">unreleased</text><rect x="60" y="136" width="680" height="48" rx="8" class="b d"/><text x="80" y="166"><tspan class="h">foundation</tspan><tspan class="m" dx="12">shared crates</tspan></text><rect x="630" y="149" width="94" height="22" rx="11" class="no"/><text x="677" y="164" text-anchor="middle" class="not">unreleased</text><rect x="60" y="196" width="680" height="48" rx="8" class="hl"/><text x="80" y="226"><tspan class="h">segment-log</tspan><tspan class="m" dx="12">embedded event log, one fsync per group</tspan></text><rect x="587" y="209" width="137" height="22" rx="11" class="ok"/><text x="655" y="224" text-anchor="middle" class="okt">0.1.0 · released</text><rect x="60" y="262" width="680" height="48" rx="8" class="o"/><text x="80" y="292"><tspan class="h">Disk</tspan><tspan class="m" dx="12">sealed history that outlives the machine</tspan></text><path d="M48,76 h-10 v168 h10" class="br"/><text x="22" y="160" transform="rotate(-90 22 160)" text-anchor="middle" class="lb">IRONFLOWX · MIT</text><rect x="60" y="332" width="26" height="14" rx="4" class="b d"/><text x="96" y="344" class="m">dashed: in progress, not yet built on segment-log</text></svg>
