name: maintainer-only

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Outside contributions are refused: a PR must come from a branch of this repository, which only
  # those with write access, and Dependabot, can push. author_association is not used: the event
  # reports a private org member as CONTRIBUTOR. The step, not the job, is conditional, so the
  # check cannot skip.
  maintainer-only:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          [ "$HEAD" = "$GITHUB_REPOSITORY" ] || { echo "::error::opened from a fork: $HEAD"; exit 1; }
